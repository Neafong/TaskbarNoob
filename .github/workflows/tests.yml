name: tests

# ทำงานต่อทุก push ลง main + ทุก Pull Request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ติดตั้ง dependencies ระบบ (Qt/X11 สำหรับ PySide6 headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 xvfb \
            fontconfig
          sudo apt-get install -y fonts-noto-color-emoji || true

      - name: ติดตั้ง Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ตรวจ compile (syntax)
        run: python -m compileall -q taskbargroups

      - name: รันเทสต์ (headless + virtual display)
        run: xvfb-run -a python tests/run.py